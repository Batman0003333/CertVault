# ?? DataSource ??????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/certificate_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? Connection Pool (HikariCP) ???????????????????????????????
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ?? JPA / Hibernate ?????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ?? Thymeleaf ????????????????????????????????????????????????
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# ?? File Upload ??????????????????????????????????????????????
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ?? Server ???????????????????????????????????????????????????
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

# ?? Logging ??????????????????????????????????????????????????
logging.level.root=WARN
logging.level.com.example.certificateuploader=INFO
logging.file.name=logs/certvault.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n