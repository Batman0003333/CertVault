<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Courses — CertVault</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
    <span class="brand">CertVault</span>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/courses}">Courses</a>
        <form method="post" th:action="@{/logout}" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-link">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <h2>All Courses</h2>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <!-- ── Add Category ───────────────────────────────────── -->
    <div class="card">
        <h3>Add New Category</h3>
        <form method="post" th:action="@{/categories/add}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-row">
                <div class="form-group">
                    <label>Category Name</label>
                    <input type="text" name="name" placeholder="e.g. DevOps" required/>
                </div>
                <button type="submit" class="btn btn-primary">Add Category</button>
            </div>
        </form>
    </div>

    <!-- ── Add Course ─────────────────────────────────────── -->
    <div class="card">
        <h3>Add New Course</h3>
        <div th:if="${#lists.isEmpty(categories)}" class="alert alert-info">
            Add a category first before adding courses.
        </div>
        <form th:unless="${#lists.isEmpty(categories)}"
              method="post" th:action="@{/courses/add}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-row">
                <div class="form-group">
                    <label>Course Name</label>
                    <input type="text" name="name"
                           placeholder="e.g. Kubernetes Advanced" required/>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" name="description"
                           placeholder="Short description (optional)"/>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select name="categoryId" required>
                        <option value="">-- Select category --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}">
                        </option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Add Course</button>
            </div>
        </form>
    </div>

    <!-- ── No categories ──────────────────────────────────── -->
    <div th:if="${#lists.isEmpty(categories)}" class="card">
        <p class="empty-msg">No categories yet. Add one above to get started.</p>
    </div>

    <!-- ── Category + Course listing ─────────────────────── -->
    <div th:each="category : ${categories}" class="card">

        <!-- Category header row -->
        <div class="category-header">
            <h3 th:text="${category.name}"></h3>
            <form method="post"
                  th:action="@{/categories/deactivate/{id}(id=${category.id})}">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-warning btn-sm"
                        onclick="return confirm('Deactivate this category and all its courses?')">
                    Deactivate Category
                </button>
            </form>
        </div>

        <!-- No courses -->
        <div th:if="${category.courses == null or #lists.isEmpty(category.courses)}">
            <p class="empty-msg">No courses in this category yet.</p>
        </div>

        <!-- Courses table -->
        <table th:unless="${category.courses == null or #lists.isEmpty(category.courses)}"
               class="table">
            <thead>
            <tr>
                <th>Course Name</th>
                <th>Description</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="course : ${category.courses}"
                th:classappend="${!course.active} ? 'row-inactive' : ''">

                <td th:text="${course.name}"></td>
                <td th:text="${course.description != null
                                   and !#strings.isEmpty(course.description)}
                                  ? ${course.description} : '—'">
                </td>

                <!-- Status badge -->
                <td>
                        <span th:if="${course.active}"
                              class="status-badge status-active">Active</span>
                    <span th:unless="${course.active}"
                          class="status-badge status-inactive">Inactive</span>
                </td>

                <!-- Actions -->
                <td class="action-btns">
                    <!-- Deactivate (only if active) -->
                    <form th:if="${course.active}"
                          method="post"
                          th:action="@{/courses/deactivate/{id}(id=${course.id})}">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-warning btn-sm"
                                onclick="return confirm('Mark this course as inactive?')">
                            Deactivate
                        </button>
                    </form>

                    <!-- Restore (only if inactive) -->
                    <form th:unless="${course.active}"
                          method="post"
                          th:action="@{/courses/restore/{id}(id=${course.id})}">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-restore btn-sm">
                            Restore
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
