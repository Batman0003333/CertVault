<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Dashboard — CertVault</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
    <span class="brand">CertVault</span>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/courses}">Courses</a>
        <form method="post" th:action="@{/logout}" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-link">Logout</button>
        </form>
    </div>
</nav>

<div class="container">

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <!-- ── Upload form ────────────────────────────────────── -->
    <div class="card">
        <h3>Upload Certificate</h3>
        <div th:if="${#lists.isEmpty(availableCourses)}" class="alert alert-info">
            You have active certificates for all available courses.
        </div>
        <form th:unless="${#lists.isEmpty(availableCourses)}"
              method="post" th:action="@{/upload}" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-row">
                <div class="form-group">
                    <label>Select File <span class="hint">(PDF, PNG or JPEG — max 20MB)</span></label>
                    <input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg" required/>
                </div>
                <div class="form-group">
                    <label>Course</label>
                    <select name="courseId" required>
                        <option value="">-- Select course --</option>
                        <option th:each="course : ${availableCourses}"
                                th:value="${course.id}"
                                th:text="${course.name}">
                        </option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Upload</button>
            </div>
        </form>
    </div>

    <!-- ── Search & Filter ────────────────────────────────── -->
    <div class="card">
        <h3>Search & Filter</h3>
        <form method="get" th:action="@{/dashboard}">
            <div class="form-row">
                <div class="form-group">
                    <label>File Name</label>
                    <input type="text" name="keyword"
                           placeholder="Search by file name..."
                           th:value="${keyword}"/>
                </div>
                <div class="form-group">
                    <label>Course</label>
                    <select name="courseId">
                        <option value="0">-- All Courses --</option>
                        <option th:each="course : ${courses}"
                                th:value="${course.id}"
                                th:text="${course.name}"
                                th:selected="${courseId == course.id}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>File Type</label>
                    <select name="fileType">
                        <option value="">-- All Types --</option>
                        <option value="application/pdf"
                                th:selected="${fileType == 'application/pdf'}">PDF</option>
                        <option value="image/png"
                                th:selected="${fileType == 'image/png'}">PNG</option>
                        <option value="image/jpeg"
                                th:selected="${fileType == 'image/jpeg'}">JPEG</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="showInactive">
                        <option value=""    th:selected="${showInactive == null || showInactive == ''}">Active only</option>
                        <option value="true" th:selected="${showInactive == 'true'}">Show all (incl. inactive)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Search</button>
                <a th:href="@{/dashboard}" class="btn btn-secondary">Clear</a>
            </div>
        </form>
    </div>

    <!-- ── Certificates table ─────────────────────────────── -->
    <div class="card">
        <h3>
            My Certificates
            <span class="badge" th:text="${#lists.size(certificates)}"></span>
        </h3>

        <div th:if="${#lists.isEmpty(certificates)}">
            <p class="empty-msg">No certificates found.</p>
        </div>

        <table th:unless="${#lists.isEmpty(certificates)}" class="table">
            <thead>
            <tr>
                <th>File Name</th>
                <th>Course</th>
                <th>Upload Date</th>
                <th>Type</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cert : ${certificates}"
                th:classappend="${!cert.active} ? 'row-inactive' : ''">

                <td th:text="${cert.fileName}"></td>
                <td th:text="${cert.course != null ? cert.course.name : '—'}"></td>
                <td th:text="${cert.uploadDate}"></td>

                <!-- File type badge -->
                <td>
                        <span class="file-badge"
                              th:classappend="${cert.fileType == 'application/pdf'} ? 'badge-pdf' :
                                             (${cert.fileType == 'image/png'} ? 'badge-png' : 'badge-jpg')"
                              th:text="${cert.fileType == 'application/pdf'} ? 'PDF' :
                                       (${cert.fileType == 'image/png'} ? 'PNG' : 'JPEG')">
                        </span>
                </td>

                <!-- Status badge -->
                <td>
                    <span th:if="${cert.active}"  class="status-badge status-active">Active</span>
                    <span th:unless="${cert.active}" class="status-badge status-inactive">Inactive</span>
                </td>

                <!-- Actions -->
                <td class="action-btns">
                    <!-- Download (always available) -->
                    <a th:href="@{/download/{id}(id=${cert.id})}"
                       class="btn btn-success">Download</a>

                    <!-- Deactivate (only if active) -->
                    <form th:if="${cert.active}"
                          method="post"
                          th:action="@{/deactivate/{id}(id=${cert.id})}"
                          style="display:inline">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-warning"
                                onclick="return confirm('Mark this certificate as inactive?')">
                            Deactivate
                        </button>
                    </form>

                    <!-- Restore (only if inactive) -->
                    <form th:unless="${cert.active}"
                          method="post"
                          th:action="@{/restore/{id}(id=${cert.id})}"
                          style="display:inline">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-restore">
                            Restore
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
